name: Diagnose Vercel rollback adapter

on:
  push:
    branches: [main]
    paths:
      - 'app/api/studio/projects/[projectId]/revisions/[revisionId]/execute/route.ts'
      - '.github/workflows/diagnose-vercel-rollback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate rollback target contract
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/api/studio/projects/[projectId]/revisions/[revisionId]/execute/route.ts'
          test -f "$FILE"
          grep -q "resolutionPolicy: 'PREVIOUS_READY_PRODUCTION'" "$FILE"
          grep -q "deliveryAnchorDeploymentId" "$FILE"
          grep -q "VERCEL_CURRENT_PRODUCTION_REQUIRED" "$FILE"
          grep -q "VERCEL_ROLLBACK_TARGET_REQUIRED" "$FILE"
          grep -q "VERCEL_DELIVERY_ANCHOR_RECONCILIATION_REQUIRED" "$FILE"

      - name: Validate workflow is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          FILE='.github/workflows/diagnose-vercel-rollback.yml'
          ! grep -qE 'git (commit|push)|contents: write|git add' "$FILE"

      - name: Validate TypeScript rollback markers
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/api/studio/projects/[projectId]/revisions/[revisionId]/execute/route.ts'
          grep -q "const currentId = projectPayload.targets?.production?.id" "$FILE"
          grep -q "targetDeploymentId" "$FILE"
          grep -q "targetCreatedAt" "$FILE"
          grep -q "policy: rollbackTarget.resolutionPolicy" "$FILE"
