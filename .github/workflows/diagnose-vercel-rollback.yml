name: Diagnose Vercel rollback adapter
on:
  push:
    branches: [fix/studio-vercel-rollback-native-error]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rollback target contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/api/studio/projects/[projectId]/revisions/[revisionId]/execute/route.ts')
          s = p.read_text()
          start = s.index('async function resolveRollbackTarget(')
          end = s.index('type VercelRollbackFailure', start)
          new = '''async function resolveRollbackTarget(secret: string, projectId: string, deliveryAnchorId?: string) {
            const projectResponse = await fetch(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}`, { headers: { Authorization: `Bearer ${secret}` }, cache: 'no-store' });
            if (!projectResponse.ok) throw new Error(`VERCEL_PROJECT_READ_FAILED:${projectResponse.status}`);
            const projectPayload = await projectResponse.json() as { targets?: { production?: { id?: string } } };
            const currentId = projectPayload.targets?.production?.id;
            if (!currentId) throw new Error('VERCEL_CURRENT_PRODUCTION_REQUIRED');

            const deploymentsResponse = await fetch(`https://api.vercel.com/v6/deployments?projectId=${encodeURIComponent(projectId)}&target=production&state=READY&until=${Date.now()}&limit=100`, { headers: { Authorization: `Bearer ${secret}` }, cache: 'no-store' });
            if (!deploymentsResponse.ok) throw new Error(`VERCEL_DEPLOYMENTS_READ_FAILED:${deploymentsResponse.status}`);
            const deploymentsPayload = await deploymentsResponse.json() as { deployments?: Array<{ uid?: string; id?: string; created?: number; readyState?: string; target?: string | null; state?: string }> };
            const deployments = deploymentsPayload.deployments ?? [];
            const idOf = (deployment: (typeof deployments)[number]) => deployment.uid ?? deployment.id;
            const current = deployments.find((deployment) => idOf(deployment) === currentId);
            const currentCreated = Number(current?.created ?? 0);
            const currentReady = current?.readyState === 'READY' || current?.state === 'READY';
            if (!current || !currentCreated || current.target !== 'production' || !currentReady) throw new Error('VERCEL_CURRENT_PRODUCTION_REQUIRED');

            const anchor = deliveryAnchorId ? deployments.find((deployment) => idOf(deployment) === deliveryAnchorId) : undefined;
            if (deliveryAnchorId && (!anchor || anchor.target !== 'production' || !(anchor.readyState === 'READY' || anchor.state === 'READY') || Number(anchor.created ?? 0) >= currentCreated)) throw new Error('VERCEL_DELIVERY_ANCHOR_RECONCILIATION_REQUIRED');

            const candidates = deployments
              .filter((deployment) => {
                const deploymentId = idOf(deployment);
                return Boolean(deploymentId) && deploymentId !== currentId && deployment.target === 'production' && (deployment.readyState === 'READY' || deployment.state === 'READY') && Number(deployment.created ?? 0) < currentCreated;
              })
              .sort((a, b) => Number(b.created ?? 0) - Number(a.created ?? 0));
            if (!candidates.length) throw new Error('VERCEL_ROLLBACK_TARGET_REQUIRED');
            const targetDeploymentId = idOf(candidates[0]);
            if (!targetDeploymentId) throw new Error('VERCEL_ROLLBACK_TARGET_REQUIRED');

            return {
              currentDeploymentId: currentId,
              deliveryAnchorDeploymentId: deliveryAnchorId ?? null,
              targetDeploymentId,
              targetCreatedAt: Number(candidates[0].created ?? 0),
              resolutionPolicy: 'PREVIOUS_READY_PRODUCTION',
            };
          }
'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/studio/projects/[projectId]/revisions/[revisionId]/execute/route.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(studio): resolve rollback target independently of stale delivery anchor'
          git push
