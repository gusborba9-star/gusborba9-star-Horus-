name: Diagnose Vercel rollback adapter
on:
  push:
    branches: [fix/studio-vercel-rollback-native-error]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make rollback diagnostic logging type-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/studio/projects/[projectId]/revisions/[revisionId]/execute/route.ts')
          s = p.read_text()
          old = "    if (executionLogId) await service.from('horus_execution_logs').update({ status: 'ERROR', error_message: message, completed_at: new Date().toISOString(), metadata: { executionId, action: 'ROLLBACK', providerError: providerFailure } }).eq('id', executionLogId).catch(() => undefined);"
          new = "    if (executionLogId) { try { await service.from('horus_execution_logs').update({ status: 'ERROR', error_message: message, completed_at: new Date().toISOString(), metadata: { executionId, action: 'ROLLBACK', providerError: providerFailure } }).eq('id', executionLogId); } catch { /* preserve original execution failure */ } }"
          if old not in s:
              raise SystemExit('diagnostic catch pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/studio/projects/[projectId]/revisions/[revisionId]/execute/route.ts
          git commit -m 'fix(studio): make rollback diagnostics type-safe'
          git push
