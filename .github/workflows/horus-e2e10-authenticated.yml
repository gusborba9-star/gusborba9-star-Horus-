name: horus-e2e10-authenticated

# Live authenticated E2E is isolated from deterministic horus-ci.
# Only SUPABASE_SERVICE_ROLE_KEY is sensitive; public Supabase/Vercel configuration is stable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/api/collaborators/**'
      - 'lib/collaborators/**'
      - 'app/api/personal/**'
      - 'app/dashboard/personal/**'
      - 'lib/personal/**'
      - 'lib/nexus/**'
      - 'lib/providers/**'
      - 'tests/e2e10-authenticated-collaborator.mjs'
      - 'tests/e2e11-authenticated-personal.mjs'
      - 'tests/e2e11-memory-context.mjs'
      - 'tests/e2e11-voice.mjs'
      - 'package.json'
      - '.github/workflows/horus-e2e10-authenticated.yml'

permissions:
  contents: read

jobs:
  authenticated-e2e10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ljqmiuxztqseyglhvgmi.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Jmz78HPb__KT2zqC3AslIg_8CkWkmIq
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_BASE_URL: https://velor-api-gustavo-borba-s-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate required E2E configuration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Missing Supabase URL'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo 'Missing public Supabase key'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY GitHub Actions secret'; exit 1; }
          test -n "$E2E_BASE_URL" || { echo 'Missing Production URL'; exit 1; }
      - name: Obtain GitHub OIDC token for Vercel Trusted Sources
        id: vercel_oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Run authenticated E2E 10
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_oidc.outputs.token }}
        run: npm run test:e2e10

  authenticated-e2e11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: authenticated-e2e10
    permissions:
      id-token: write
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ljqmiuxztqseyglhvgmi.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Jmz78HPb__KT2zqC3AslIg_8CkWkmIq
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_BASE_URL: https://velor-api-gustavo-borba-s-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install real speech fixture generator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak
          espeak --version
      - name: Validate required E2E configuration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Missing Supabase URL'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo 'Missing public Supabase key'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY GitHub Actions secret'; exit 1; }
          test -n "$E2E_BASE_URL" || { echo 'Missing Production URL'; exit 1; }
      - name: Obtain GitHub OIDC token for Vercel Trusted Sources
        id: vercel_oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Run authenticated E2E 11
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_oidc.outputs.token }}
        run: npm run test:e2e11
